# SonarCloud Automatic Analysis configuration
# https://docs.sonarsource.com/sonarqube-cloud/managing-projects/automatic-analysis/

# pyproject.toml has only pytest config (no [project] / poetry / uv) so the
# missing-lockfile rule does not apply to this HA custom integration.
# tests/** are excluded from analysis — test code quality is verified by
# the test suite passing, not by static analysis gates.
sonar.exclusions=pyproject.toml,tests/**
