add_refuelling:
  name: Add refuelling
  description: Log a refuelling in Drivvo.
  fields:
    vehicle_id:
      name: Vehicle
      description: Drivvo vehicle id, as configured in the integration.
      required: true
      example: "4611323"
      selector:
        text:
    odometer:
      name: Odometer
      description: Odometer at the moment of the refuelling.
      required: true
      example: 78703
      selector:
        number:
          min: 0
          max: 9999999
          mode: box
    total_value:
      name: Total value
      description: Amount paid. Give at least two of total value, price and volume.
      example: 227.74
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    price:
      name: Price
      description: Price per unit of volume.
      example: 5.99
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    volume:
      name: Volume
      description: Volume refuelled.
      example: 38.02
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    full_tank:
      name: Full tank
      description: Whether the tank was filled up. Consumption is only measured between full tanks.
      default: true
      selector:
        boolean:
    fuel:
      name: Fuel
      description: Name of the fuel as registered in Drivvo. Defaults to the first registered fuel.
      example: Gas. Comum
      selector:
        text:
    station:
      name: Station
      description: Name of the fuel station as registered in Drivvo.
      example: Posto Natal II
      selector:
        text:
    date:
      name: Date
      description: When it happened. Defaults to now.
      selector:
        datetime:
    note:
      name: Note
      description: Free text stored with the record.
      selector:
        text:

